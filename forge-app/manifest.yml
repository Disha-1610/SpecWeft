# SpecWeft for Bitbucket — Forge app.
# Run `forge register` once: it replaces app.id below with your own app id.
modules:
  bitbucket:repoPullRequestOverviewPanel:
    - key: specweft-pr-panel
      title: SpecWeft — files this PR may break
      resource: main
      render: native
      resolver:
        function: resolver
  bitbucket:mergeCheck:
    - key: specweft-merge-check
      name: SpecWeft contract check
      description: Fails only when both SpecWeft signals (code agreements + agent
        navigation) say an unchanged file must be updated.
      function: merge-check
      triggers:
        - on-code-pushed
  bitbucket:repoSettingsMenuPage:
    - key: specweft-settings
      title: SpecWeft
      resource: settings
      render: native
      resolver:
        function: resolver
  bitbucket:workspaceGlobalPage:
    - key: specweft-home
      title: SpecWeft
      resource: home
      render: native
      resolver:
        function: resolver
  trigger:
    - key: specweft-installed
      function: installed
      events:
        - avi:forge:installed:app
  function:
    - key: resolver
      handler: index.handler
    - key: merge-check
      handler: index.mergeCheck
    - key: installed
      handler: index.onInstalled
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: settings
    path: src/frontend/settings.jsx
  - key: home
    path: src/frontend/home.jsx
remotes:
  - key: specweft-backend
    # Public HTTPS URL of the SpecWeft Python server (python -m specweft.cli serve, behind TLS).
    baseUrl: https://specweft.onrender.com
    operations:
      - compute
permissions:
  scopes:
    - read:repository:bitbucket
    - read:pullrequest:bitbucket
    - write:pullrequest:bitbucket
    - storage:app
app:
  id: ari:cloud:ecosystem::app/b1604e45-5a67-42e7-978f-ac64eb1edba9
  runtime:
    name: nodejs22.x
